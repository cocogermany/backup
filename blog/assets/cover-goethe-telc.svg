<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="gt-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#gt-bg)"/>

  <!-- Grid overlay -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="125" x2="800" y2="125"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Left Side: Goethe-Zertifikat -->
  <g transform="translate(80, 80)">
    <rect width="280" height="340" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <rect x="24" y="24" width="90" height="26" rx="13" fill="#6366f1" fill-opacity="0.3" stroke="#818cf8" stroke-width="1"/>
    <text x="69" y="41" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">GOETHE</text>
    <text x="24" y="90" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800">Zertifikat B1</text>
    <text x="24" y="114" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Modular Examination</text>

    <g transform="translate(24, 150)">
      <circle cx="10" cy="10" r="4" fill="#818cf8"/>
      <text x="24" y="14" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Independent Modules</text>
      
      <circle cx="10" cy="50" r="4" fill="#818cf8"/>
      <text x="24" y="54" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Flexible Retakes</text>

      <circle cx="10" cy="90" r="4" fill="#818cf8"/>
      <text x="24" y="94" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Worldwide Recognition</text>
    </g>

    <rect x="24" y="275" width="232" height="36" rx="10" fill="rgba(99, 102, 241, 0.2)"/>
    <text x="140" y="298" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">60% Required per Module</text>
  </g>

  <!-- VS Badge -->
  <g transform="translate(375, 220)">
    <circle cx="25" cy="25" r="28" fill="#1e1b4b" stroke="url(#gold-grad)" stroke-width="3"/>
    <text x="25" y="32" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900" text-anchor="middle">VS</text>
  </g>

  <!-- Right Side: telc -->
  <g transform="translate(440, 80)">
    <rect width="280" height="340" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <rect x="24" y="24" width="70" height="26" rx="13" fill="#10b981" fill-opacity="0.25" stroke="#34d399" stroke-width="1"/>
    <text x="59" y="41" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">TELC</text>
    <text x="24" y="90" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800">Deutsch B1</text>
    <text x="24" y="114" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Unified Block Examination</text>

    <g transform="translate(24, 150)">
      <circle cx="10" cy="10" r="4" fill="#34d399"/>
      <text x="24" y="14" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Integrated Time Block</text>
      
      <circle cx="10" cy="50" r="4" fill="#34d399"/>
      <text x="24" y="54" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Sprachbausteine Section</text>

      <circle cx="10" cy="90" r="4" fill="#34d399"/>
      <text x="24" y="94" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Accepted for Naturalization</text>
    </g>

    <rect x="24" y="275" width="232" height="36" rx="10" fill="rgba(16, 185, 129, 0.2)"/>
    <text x="140" y="298" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Combined Written Passing</text>
  </g>
</svg>
