<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="60%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="rgba(129, 140, 248, 0.35)"/>
      <stop offset="100%" stop-color="rgba(129, 140, 248, 0)"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#090a1a" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg-grad)"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <!-- Subtle Blueprint Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
  </g>

  <!-- Left Card: Exam Booklet Simulation -->
  <g transform="translate(60, 70)" filter="url(#shadow)">
    <rect width="360" height="360" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
    
    <!-- Header pills -->
    <rect x="24" y="28" width="110" height="26" rx="13" fill="#6366f1" fill-opacity="0.3" stroke="#818cf8" stroke-width="1"/>
    <text x="79" y="45" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">GOETHE &amp; TELC</text>

    <rect x="144" y="28" width="70" height="26" rx="13" fill="#10b981" fill-opacity="0.25" stroke="#34d399" stroke-width="1"/>
    <text x="179" y="45" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">A1–B2</text>

    <!-- Main Title inside card -->
    <text x="24" y="98" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">Prüfungstraining</text>
    <text x="24" y="124" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">Simulated Mock Exam Paper</text>

    <!-- Modules Progress bars -->
    <g transform="translate(24, 154)">
      <text x="0" y="14" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Leseverstehen</text>
      <text x="312" y="14" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="end">100%</text>
      <rect x="0" y="22" width="312" height="7" rx="3.5" fill="rgba(255,255,255,0.1)"/>
      <rect x="0" y="22" width="312" height="7" rx="3.5" fill="#34d399"/>
    </g>

    <g transform="translate(24, 204)">
      <text x="0" y="14" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Hörverstehen</text>
      <text x="312" y="14" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="end">92%</text>
      <rect x="0" y="22" width="312" height="7" rx="3.5" fill="rgba(255,255,255,0.1)"/>
      <rect x="0" y="22" width="287" height="7" rx="3.5" fill="#818cf8"/>
    </g>

    <g transform="translate(24, 254)">
      <text x="0" y="14" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Schriftlicher Ausdruck</text>
      <text x="312" y="14" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="end">95%</text>
      <rect x="0" y="22" width="312" height="7" rx="3.5" fill="rgba(255,255,255,0.1)"/>
      <rect x="0" y="22" width="296" height="7" rx="3.5" fill="url(#accent-grad)"/>
    </g>

    <!-- Passing Status Banner -->
    <rect x="24" y="306" width="312" height="34" rx="10" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(52, 211, 153, 0.3)" stroke-width="1"/>
    <circle cx="44" cy="323" r="6" fill="#34d399"/>
    <text x="60" y="328" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Official Exam Readiness: READY</text>
  </g>

  <!-- Right Visual: Timed Clock and Badge -->
  <g transform="translate(480, 80)" filter="url(#shadow)">
    <!-- Timer Display -->
    <rect width="260" height="150" rx="18" fill="#ffffff" fill-opacity="0.08" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <text x="24" y="38" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1">EXAM TIMER</text>
    <text x="24" y="86" fill="#ffffff" font-family="'Courier New', Courier, monospace" font-size="36" font-weight="800">01:15:00</text>
    
    <rect x="24" y="104" width="212" height="28" rx="8" fill="#e0e7ff" fill-opacity="0.1"/>
    <text x="130" y="122" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Simulated Countdown Mode</text>

    <!-- Circular Badge: High Score -->
    <g transform="translate(40, 180)">
      <circle cx="90" cy="90" r="75" fill="#1e1b4b" stroke="url(#accent-grad)" stroke-width="4"/>
      <circle cx="90" cy="90" r="66" fill="#312e81" fill-opacity="0.6"/>
      <text x="90" y="78" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" text-anchor="middle">96%</text>
      <text x="90" y="100" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">PASS RATE</text>
      <text x="90" y="116" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">With Mock Routine</text>
    </g>
  </g>
</svg>
